name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.x 与 Kotlin 2.2 都要 JDK 17；gradle.properties 里没有改 toolchain 自动下载，
      # 所以这里显式装好，别让 runner 去猜。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # lintVitalRelease 是发布前的硬门槛：备份规则写错、缺翻译、泄漏的权限都会在这里红。
      - name: Release build (R8 + lint)
        run: ./gradlew --no-daemon assembleRelease

      - name: APK size report
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "$apk: $(du -h "$apk" | cut -f1)"

      # 未签名的产物：只给想上手试的人，不能当成正式渠道包。
      - uses: actions/upload-artifact@v4
        with:
          name: wordlens-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
