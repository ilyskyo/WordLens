# Project-wide Gradle settings.
# This file stays portable on purpose: do NOT put a machine-specific org.gradle.java.home
# here, otherwise contributors on other machines cannot build. See docs/BUILD.md for how to
# point the CLI at a JDK (JAVA_HOME or Android Studio's bundled JBR).

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Models and lexicon are read at runtime from assets; keep them uncompressed so the
# first launch does not pay an inflate cost (mirrors the Blancall convention).
android.useAndroidX=true
android.nonTransitiveRClass=true
